{% extends "layout.html" %}
{% block title %}{% if mode == 'edit' %}거래처 수정{% else %}새 거래처{% endif %}{% endblock %}

{% block content %}
<h1 class="h3 mb-4">{% if mode == 'edit' %}거래처 수정{% else %}새 거래처{% endif %}</h1>

<form method="post" class="row g-3" novalidate>
  <div class="col-md-6">
    <label class="form-label" for="business_id">사업자등록번호</label>
    <input class="form-control" id="business_id" name="business_id" type="text" value="{{ form_state.business_id }}" {% if mode == 'edit' %}readonly{% endif %} required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="company_name">상호명</label>
    <input class="form-control" id="company_name" name="company_name" type="text" value="{{ form_state.company_name }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="representative">대표자</label>
    <input class="form-control" id="representative" name="representative" type="text" value="{{ form_state.representative }}" required>
  </div>
  <div class="col-12">
    <label class="form-label" for="address">주소</label>
    <input class="form-control" id="address" name="address" type="text" value="{{ form_state.address }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="phone">전화번호</label>
    <input class="form-control" id="phone" name="phone" type="text" value="{{ form_state.phone }}" required>
  </div>
  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary" type="submit">{% if mode == 'edit' %}수정 완료{% else %}저장{% endif %}</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('customers.index') }}">취소</a>
  </div>
</form>
{% endblock %}
