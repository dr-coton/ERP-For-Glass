{% extends "layout.html" %}
{% block title %}{% if mode == 'edit' %}상품 수정{% else %}새 상품{% endif %}{% endblock %}

{% block content %}
<h1 class="h3 mb-4">{% if mode == 'edit' %}상품 수정{% else %}새 상품{% endif %}</h1>

<form method="post" class="row g-3" novalidate>
  <div class="col-md-6">
    <label class="form-label" for="name">품목명</label>
    <input class="form-control" id="name" name="name" type="text" value="{{ form_state.name }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="production_price">제작가</label>
    <input class="form-control" id="production_price" name="production_price" type="number" min="0" step="1" value="{{ form_state.production_price }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="single_side_price">일면(500)</label>
    <input class="form-control" id="single_side_price" name="single_side_price" type="number" min="0" step="1" value="{{ form_state.single_side_price }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="double_side_price">양면(700)</label>
    <input class="form-control" id="double_side_price" name="double_side_price" type="number" min="0" step="1" value="{{ form_state.double_side_price }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="direct_price">직매</label>
    <input class="form-control" id="direct_price" name="direct_price" type="number" min="0" step="1" value="{{ form_state.direct_price }}" required>
  </div>
  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary" type="submit">{% if mode == 'edit' %}수정 완료{% else %}저장{% endif %}</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('products.index') }}">취소</a>
  </div>
</form>
{% endblock %}
